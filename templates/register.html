<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | dMAT Exam Portal 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-center items-center font-sans p-4">

    <div class="glass-panel rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-700/80 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-accent-cyan via-brand-600 to-accent-purple flex items-center justify-center mx-auto text-white text-xl shadow-lg">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Create Candidate Account</h2>
            <p class="text-xs text-slate-400">Sign up to start official dMAT Exam Practice & Timed Tests!</p>
        </div>

        <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user-plus absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="register-username" minlength="3" required placeholder="Choose username (min 3 chars)"
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="password" id="register-password" minlength="4" required placeholder="Create password (min 4 chars)"
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <div id="register-error" class="hidden text-xs text-rose-400 font-semibold p-2.5 bg-rose-950/40 rounded-lg border border-rose-800/40"></div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-accent-cyan via-brand-600 to-indigo-600 hover:opacity-95 text-white font-bold rounded-xl transition shadow-lg shadow-cyan-500/20 text-base">
                Create Account & Start Practice
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
            Already have an account? <a href="/login" class="text-brand-400 hover:underline font-bold">Sign In</a>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
