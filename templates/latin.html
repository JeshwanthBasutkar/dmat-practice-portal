<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5×5 Latin Square Practice | dMAT 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-700/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-accent-cyan to-accent-purple flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">
                        dMAT <span class="text-brand-400 font-semibold">Prep 2026</span>
                    </span>
                    <span class="block text-[10px] uppercase font-bold tracking-widest text-amber-400 -mt-1">
                        <i class="fa-regular fa-calendar-check mr-1"></i>Exam Date: 26 Sep 2026
                    </span>
                </div>
            </a>

            <div class="flex items-center space-x-3">
                <button onclick="openModal('leaderboard-modal')" class="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition flex items-center space-x-1.5 rounded-lg hover:bg-slate-800/60">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span class="hidden sm:inline">Leaderboard</span>
                </button>

                <div id="auth-header-container" class="flex items-center space-x-2"></div>
            </div>
        </div>
    </header>

    <!-- Main Practice Section -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="flex items-center justify-between">
            <a href="/dashboard" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-xl text-sm font-semibold transition border border-slate-700 flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Dashboard</span>
            </a>

            <div class="flex items-center space-x-2 text-xs font-semibold text-brand-400 bg-brand-950/80 px-3 py-1.5 rounded-full border border-brand-800">
                <i class="fa-solid fa-award"></i>
                <span>Reward: 5 Points / Solved Puzzle</span>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700/50">
                <div>
                    <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                        <span>5×5 Latin Square Matrix</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">Deduce the missing letter (A - E) for the glowing <span class="text-amber-400 font-bold">'?'</span> cell.</p>
                </div>
                <button onclick="fetchLatinPuzzle()" title="Generate New Puzzle" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center justify-center border border-slate-700">
                    <i class="fa-solid fa-rotate text-sm"></i>
                </button>
            </div>

            <!-- Matrix Board -->
            <div class="relative max-w-md mx-auto aspect-square my-4 p-4 rounded-2xl bg-slate-950/70 border border-slate-800/80 shadow-inner flex flex-col justify-center">
                <div id="puzzle-board" class="grid grid-cols-5 gap-2 sm:gap-3 w-full h-full"></div>
            </div>

            <!-- Symbol Keyboard -->
            <div class="mt-6">
                <label class="block text-center text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Select Answer Symbol</label>
                <div class="flex justify-center items-center gap-2 sm:gap-3 max-w-md mx-auto">
                    <button onclick="selectLatinSymbol('A')" class="symbol-btn flex-1 py-3 bg-slate-800 hover:bg-brand-600 text-white font-extrabold text-xl rounded-xl border border-slate-700 transition shadow-md focus:outline-none">A</button>
                    <button onclick="selectLatinSymbol('B')" class="symbol-btn flex-1 py-3 bg-slate-800 hover:bg-brand-600 text-white font-extrabold text-xl rounded-xl border border-slate-700 transition shadow-md focus:outline-none">B</button>
                    <button onclick="selectLatinSymbol('C')" class="symbol-btn flex-1 py-3 bg-slate-800 hover:bg-brand-600 text-white font-extrabold text-xl rounded-xl border border-slate-700 transition shadow-md focus:outline-none">C</button>
                    <button onclick="selectLatinSymbol('D')" class="symbol-btn flex-1 py-3 bg-slate-800 hover:bg-brand-600 text-white font-extrabold text-xl rounded-xl border border-slate-700 transition shadow-md focus:outline-none">D</button>
                    <button onclick="selectLatinSymbol('E')" class="symbol-btn flex-1 py-3 bg-slate-800 hover:bg-brand-600 text-white font-extrabold text-xl rounded-xl border border-slate-700 transition shadow-md focus:outline-none">E</button>
                </div>
            </div>

            <!-- Submit Controls -->
            <div class="mt-6 flex flex-col sm:flex-row items-center gap-3 max-w-md mx-auto">
                <input type="text" id="user-answer-input" maxlength="1" readonly placeholder="Choice"
                    class="w-full text-center text-2xl font-black py-3 px-4 bg-slate-900/90 border-2 border-slate-700 rounded-xl text-amber-400 uppercase focus:outline-none cursor-default">
                <button onclick="submitLatinAnswer()"
                    class="w-full py-3.5 px-6 font-bold text-white bg-gradient-to-r from-brand-600 via-indigo-600 to-accent-cyan hover:from-brand-500 hover:to-cyan-400 transition rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center space-x-2 text-lg">
                    <span>Submit Answer</span>
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>

            <!-- Feedback Banner -->
            <div id="latin-feedback-banner" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-semibold transition-all"></div>
        </div>
    </main>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
        <div class="glass-panel rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl relative border border-slate-700/80 max-h-[90vh] flex flex-col">
            <button onclick="closeModal('leaderboard-modal')" class="absolute top-5 right-5 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div>
                    <h3 class="text-xl font-extrabold text-white">Global Candidate Leaderboard</h3>
                    <p class="text-xs text-slate-400">Ranked by score (5 pts per solved question)</p>
                </div>
            </div>
            <div class="overflow-y-auto flex-grow pr-1">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/80 text-slate-400 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 rounded-l-xl">Rank</th>
                            <th class="px-4 py-3">Candidate</th>
                            <th class="px-4 py-3 text-center">Puzzles Solved</th>
                            <th class="px-4 py-3 text-center">Best Streak</th>
                            <th class="px-4 py-3 text-right rounded-r-xl">Score</th>
                        </tr>
                    </thead>
                    <tbody id="full-leaderboard-tbody" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/latin.js"></script>
</body>
</html>
